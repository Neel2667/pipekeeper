<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PipeKeeper — Live Data Status</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --ink:#e8edf7; --dim:#93a1bd; --accent:#4da3ff; --new:#3ddc84; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:2rem; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:1.5rem; margin-bottom:.25rem; }
  .sub { color:var(--dim); margin-bottom:1.5rem; }
  .stats { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .stat { background:var(--card); border-radius:12px; padding:1rem 1.25rem; min-width:150px; }
  .stat .n { font-size:1.8rem; font-weight:700; color:var(--accent); }
  .stat .l { color:var(--dim); font-size:.85rem; }
  .stat .n.new { color:var(--new); }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; }
  th { text-align:left; color:var(--dim); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; padding:.75rem 1rem; border-bottom:1px solid #2a3550; }
  td { padding:.7rem 1rem; border-bottom:1px solid #232c44; }
  tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; background:var(--new); color:#06281a; font-size:.7rem; font-weight:700; padding:.15rem .5rem; border-radius:99px; }
  .foot { color:var(--dim); font-size:.8rem; margin-top:1.5rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>PipeKeeper — Live Data Status</h1>
  <p class="sub">Collected automatically, every hour, with zero servers of ours to break.</p>
  <div class="stats" id="stats"></div>
  <table>
    <thead><tr><th>Job title</th><th>Location</th><th>Est. pay / week</th><th>Contract</th><th>Type</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="6">loading…</td></tr></tbody>
  </table>
  <p class="foot" id="foot"></p>
</div>
<script>
const RAW = "https://raw.githubusercontent.com/Neel2667/pipekeeper/main/data/hosthealthcare.json";
const fmt = n => n ? "$" + Number(String(n).replace(/,/g,"")).toLocaleString("en-US",{maximumFractionDigits:0}) : "—";
async function load() {
  try {
    const d = await (await fetch(RAW + "?t=" + Date.now())).json();
    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="n">${d.jobs_on_board}</div><div class="l">jobs on board</div></div>
      <div class="stat"><div class="n new">${d.new_this_run}</div><div class="l">new this run</div></div>
      <div class="stat"><div class="n">${d.total_tracked}</div><div class="l">tracked since start</div></div>
      <div class="stat"><div class="n">${(d.runs||[]).length}</div><div class="l">collection runs</div></div>`;
    document.getElementById("rows").innerHTML = d.jobs.map(j => `
      <tr>
        <td>${j.title}</td>
        <td>${j.location}</td>
        <td>${fmt(j.pay_usd_week)}</td>
        <td>${j.weeks ? j.weeks + " wks" : "—"}</td>
        <td>${j.kind || "—"}</td>
        <td>${j.new_this_run ? '<span class="badge">NEW</span>' : ""}</td>
      </tr>`).join("");
    document.getElementById("foot").innerHTML =
      `Last collected: <b>${d.collected_at}</b> · Source: <a href="${d.source}">${d.source}</a> · Refreshes hourly · <a href="https://github.com/Neel2667/pipekeeper/actions">run history</a>`;
  } catch (e) {
    document.getElementById("foot").textContent = "Waiting for first cloud collection…";
  }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
