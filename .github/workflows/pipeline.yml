name: pipeline

# The always-on data pipeline: runs every hour on GitHub's machines.
# Collects fresh data from all registered sources, commits it, and
# leaves a health record. If a collector fails, the next run retries
# automatically; failures are visible in the Actions history.

on:
  schedule:
    - cron: "15 * * * *" # every hour at :15
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run collectors (15 feeds)
        id: collect
        run: |
          mkdir -p data
          COLLECTORS="hosthealthcare remoteok remotive weworkremotely workingnomads jobicy himalayas greenhouse hnhiring edgarformd usaspending clinicaltrials openfda510k federalregister gdelt"
          STATUS=/tmp/collector_status.txt; : > "$STATUS"
          for c in $COLLECTORS; do
            if python3 "collectors/$c.py"; then
              echo "$c ok" >> "$STATUS"
            else
              echo "$c fail" >> "$STATUS"
              echo "::warning::collector $c failed — visible in health, retries next hour"
            fi
          done
          python3 collectors/feeds_index.py "$STATUS"
          echo "failed=$(grep -c ' fail' "$STATUS" || true)" >> "$GITHUB_OUTPUT"

      - name: Commit fresh data
        run: |
          git config user.name "pipekeeper-bot"
          git config user.email "actions@pipekeeper.local"
          git add data/
          git diff --cached --quiet || git commit -m "pipeline run: $(date -u +"%Y-%m-%d %H:%M") — $(grep -c ' ok' /tmp/collector_status.txt || echo 0)/15 collectors ok"
          git push
